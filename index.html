<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>😈</text></svg>">
    <title>tprank — Все пранки</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        
        body { 
            background-color: #0a0510; 
            background-image: radial-gradient(circle at 50% 0%, #2a1042 0%, #0a0510 70%); 
            color: #fff; 
            font-family: 'Inter', sans-serif; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            overflow-x: hidden;
        }

        /* ===== ШАПКА ===== */
        .header-container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
        }

        .banner-wrapper {
            width: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            border-bottom: 2px solid #4a2069;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .banner-img {
            width: 100%;
            height: auto;
            max-height: 400px;
            object-fit: contain;
            display: block;
        }

        .logo-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #0a0510;
            padding: 5px;
            object-fit: contain;
            margin-top: -60px;
            z-index: 2;
            box-shadow: 0 5px 20px rgba(0, 255, 100, 0.3);
            border: 3px solid #00ff64;
        }

        .subtitle { 
            color: #888; 
            font-size: 16px; 
            margin-top: 15px; 
            text-align: center; 
            padding: 0 20px;
            margin-bottom: 30px;
        }

        /* ===== СЕТКА ПРАНКОВ ===== */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
            gap: 15px; 
            width: 100%; 
            max-width: 1000px; 
            padding: 0 20px;
            margin-bottom: 40px;
        }
        
        .card { 
            background: #150a22; 
            border: 1px solid #4a2069; 
            border-radius: 16px; 
            padding: 20px;
            display: flex; 
            flex-direction: column;
            gap: 15px;
        }
        
        .card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
        }
        
        .btn-open {
            background: #2c2c2e;
            color: #fff;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            white-space: nowrap;
            text-decoration: none;
            transition: 0.2s;
        }
        .btn-open:hover {
            background: #00ff64;
            color: #000;
        }

        /* Блок с ссылкой и копированием */
        .card-bottom {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #0a0510;
            border: 1px solid #2a1042;
            border-radius: 10px;
            padding: 8px 12px;
        }

        .prank-url {
            flex: 1;
            font-size: 12px;
            color: #888;
            font-family: monospace;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Кнопка-картинка */
        .btn-copy-img {
            height: 32px; /* Фиксированная высота, чтобы не ломало карточку */
            width: auto;
            object-fit: contain;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-copy-img:hover {
            opacity: 0.8;
        }
        
        .loading { 
            text-align: center; 
            color: #888; 
            font-size: 16px; 
            margin-top: 50px; 
        }

        /* ===== ПОДВАЛ ===== */
        .footer {
            margin-top: auto;
            padding: 20px;
            width: 100%;
            text-align: center;
            border-top: 1px solid #1a0a2e;
            color: #666;
            font-size: 14px;
        }

        .footer a {
            color: #00ff64;
            text-decoration: none;
            font-weight: 800;
            transition: 0.2s;
            text-shadow: 0 0 10px rgba(0, 255, 100, 0.3);
        }

        .footer a:hover {
            text-decoration: underline;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <div class="header-container">
        <div class="banner-wrapper">
            <img src="https://tprank.github.io/cdn/banner/banner.png" class="banner-img" alt="Баннер">
        </div>
        <img src="https://tprank.github.io/cdn/logo/logo.png" class="logo-img" alt="Логотип">
        <div class="subtitle">Выбирай пранк — записывай на NFC-метку</div>
    </div>

    <!-- Сетка пранков -->
    <div class="grid" id="prankGrid">
        <div class="loading">Загрузка пранков...</div>
    </div>

    <!-- Подвал -->
    <div class="footer">
        Сделано с душой · <a href="https://tretiy1337.ru" target="_blank">tretiy1337.ru</a>
    </div>

    <!-- Подключаем Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC1Qrdl-tuxjodpFgNDdpAtF_VSCv90rWw",
            authDomain: "trty1-39fcb.firebaseapp.com",
            databaseURL: "https://trty1-39fcb-default-rtdb.firebaseio.com",
            projectId: "trty1-39fcb",
            storageBucket: "trty1-39fcb.firebasestorage.app",
            messagingSenderId: "438515366192",
            appId: "1:438515366192:web:f77d084c734df6935d70f5"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const grid = document.getElementById('prankGrid');
        
        // Ссылки на твои картинки кнопок
        const IMG_COPY = 'https://tprank.github.io/cdn/buttons/copy.png';
        const IMG_COPIED = 'https://tprank.github.io/cdn/buttons/copied.png';

        db.ref('tprank_menu').on('value', (snapshot) => {
            const data = snapshot.val();
            grid.innerHTML = '';

            if (!data) {
                grid.innerHTML = '<div class="loading">Пока нет пранков. Добавь их в админке!</div>';
                return;
            }

            const pranks = Object.values(data).sort((a, b) => b.createdAt - a.createdAt);
            const baseUrl = 'https://tprank.github.io/i/';

            pranks.forEach(prank => {
                const fullUrl = prank.url.startsWith('http') ? prank.url : baseUrl + prank.url;
                const shortUrl = prank.url.startsWith('http') ? prank.url : 'tprank.github.io/i/' + prank.url;

                const card = document.createElement('div');
                card.className = 'card';
                
                // Обрати внимание: в onclick передаем this (саму картинку) и ссылку
                card.innerHTML = `
                    <div class="card-top">
                        <div class="card-title">${prank.title}</div>
                        <a href="${fullUrl}" class="btn-open" target="_blank">Открыть</a>
                    </div>
                    <div class="card-bottom">
                        <div class="prank-url" title="${shortUrl}">${shortUrl}</div>
                        <img src="${IMG_COPY}" class="btn-copy-img" onclick="copyLink(this, '${fullUrl}')" alt="Копировать">
                    </div>
                `;
                grid.appendChild(card);
            });
        });

        // Функция копирования с подменой картинки
        function copyLink(imgElement, text) {
            navigator.clipboard.writeText(text).then(() => {
                // Меняем картинку на "Скопировано"
                imgElement.src = IMG_COPIED;
                
                // Через 2 секунды возвращаем обратно
                setTimeout(() => {
                    imgElement.src = IMG_COPY;
                }, 2000);
            }).catch(err => {
                console.error('Ошибка копирования: ', err);
            });
        }
    </script>
</body>
</html>
