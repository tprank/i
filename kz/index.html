<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Иконка сайта (Флаг Казахстана) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 1000 500%22><rect width=%221000%22 height=%22500%22 fill=%22%2300AF%22/><circle cx=%22500%22 cy=%22250%22 r=%22120%22 fill=%22%23FEC50C%22/><circle cx=%22500%22 cy=%22250%22 r=%22100%22 fill=%22%2300AF%22/><path d=%22M400 200 Q500 150 600 200 Q500 250 400 200%22 fill=%22%23FEC50C%22/><path d=%22M400 250 Q500 200 600 250 Q500 300 400 250%22 fill=%22%23FEC50C%22/><path d=%22M400 300 Q500 250 600 300 Q500 350 400 300%22 fill=%22%23FEC50C%22/><circle cx=%22500%22 cy=%22150%22 r=%2215%22 fill=%22%23FEC50C%22/><path d=%22M150 0 L150 500 M100 100 L200 100 M100 150 L200 150 M100 200 L200 200 M100 250 L200 250 M100 300 L200 300 M100 350 L200 350 M100 400 L200 400%22 stroke=%22%23FEC50C%22 stroke-width=%2220%22/><path d=%22M850 0 L850 500 M800 100 L900 100 M800 150 L900 150 M800 200 L900 200 M800 250 L900 250 M800 300 L900 300 M800 350 L900 350 M800 400 L900 400%22 stroke=%22%23FEC50C%22 stroke-width=%2220%22/></svg>">

    <title>Ошибка</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
        }

        /* ===== ПЕРВЫЙ ЭКРАН (ОШИБКА) ===== */
        #errorScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            transition: opacity 0.3s ease;
        }

        .error-icon {
            width: 180px;
            height: 180px;
            margin-bottom: 40px;
        }
        .error-icon svg {
            width: 100%;
            height: 100%;
        }

        h1 {
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 40px;
            color: #ffffff;
            text-align: center;
        }

        .btn-reload {
            background: #2c2c2e;
            color: #ffffff;
            border: none;
            padding: 16px 50px;
            border-radius: 30px;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
        }

        /* ===== ВТОРОЙ ЭКРАН (ПРАНК) ===== */
        #memeScreen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 20px;
        }

        .profile-pic {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background-image: url('https://tprank.github.io/cdn/kz.webp'); 
            background-size: cover;
            background-position: center;
            margin-bottom: 30px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(255,255,255,0.15);
        }
        
        .profile-pic span {
            position: absolute;
            color: #fff;
            font-weight: 900;
            font-size: 42px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.9);
            z-index: 2;
        }

        .btn-mute {
            background: #2c2c2e;
            color: #ffffff;
            border: none;
            padding: 16px 40px;
            border-radius: 25px;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>

    <!-- ПЕРВЫЙ ЭКРАН: ОШИБКА -->
    <div id="errorScreen">
        <div class="error-icon">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="45" stroke="#FFCC00" stroke-width="2"/>
                <path d="M50 25L25 75H75L50 25Z" fill="#FFCC00"/>
                <rect x="47" y="40" width="6" height="20" rx="3" fill="#000"/>
                <circle cx="50" cy="65" r="3" fill="#000"/>
            </svg>
        </div>
        <h1>Произошла неизвестная ошибка</h1>
        <button class="btn-reload">Перезагрузить</button>
    </div>

    <!-- ВТОРОЙ ЭКРАН: ПРАНК (Казахстан) -->
    <div id="memeScreen">
        <div class="profile-pic" id="profilePic">
            <span>tprank</span>
        </div>
        <button class="btn-mute">
            🔇 Mute
        </button>
    </div>

    <!-- Твой звук -->
    <audio id="prankAudio" src="https://tprank.github.io/cdn/kazakhstan-ugrozhaet-bombordirovkoi.mp3" preload="auto" loop></audio>

    <script>
        const audio = document.getElementById('prankAudio');
        const errorScreen = document.getElementById('errorScreen');
        const memeScreen = document.getElementById('memeScreen');
        let isTriggered = false;

        // Функция запуска звука и смены экрана
        function triggerPrank() {
            if (isTriggered) return;
            isTriggered = true;

            // Включаем звук на полную громкость
            audio.volume = 1.0; 
            audio.play().catch(e => console.log('Браузер заблокировал звук:', e));

            // Меняем экран
            errorScreen.style.display = 'none';
            memeScreen.style.display = 'flex';
        }

        // Клик в любом месте
        document.body.addEventListener('click', triggerPrank);
        // Касание на телефоне
        document.body.addEventListener('touchstart', triggerPrank, { passive: true });
    </script>
</body>
</html>
