<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Загрузка...</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .loader { border: 4px solid #4a2069; border-top: 4px solid #00ff64; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h1 { font-size: 24px; color: #d4a0ff; margin-bottom: 10px; }
        p { color: #888; }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h1>Перенаправление...</h1>
    <p id="status">Пожалуйста, подождите.</p>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC1Qrdl-tuxjodpFgNDdpAtF_VSCv9Orlw",
            authDomain: "trty1-39fcb.firebaseapp.com",
            databaseURL: "https://trty1-39fcb-default-rtdb.firebaseio.com",
            projectId: "trty1-39fcb",
            storageBucket: "trty1-39fcb.firebasestorage.app",
            messagingSenderId: "438515366192",
            appId: "1:438515366192:web:f77d084c734df6935d70f5"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Читаем настройку для МЕТКИ 2
        db.ref('tprank_redirects/tag2').once('value').then(snap => {
            if (snap.exists()) {
                const targetUrl = snap.val().url;
                if (targetUrl) {
                    window.location.replace(targetUrl);
                } else {
                    document.getElementById('status').textContent = 'Ссылка не настроена.';
                    document.querySelector('.loader').style.display = 'none';
                }
            } else {
                document.getElementById('status').textContent = 'Метка не настроена в админке.';
                document.querySelector('.loader').style.display = 'none';
            }
        }).catch(e => {
            document.getElementById('status').textContent = 'Ошибка базы данных.';
            document.querySelector('.loader').style.display = 'none';
        });
    </script>
</body>
</html>
