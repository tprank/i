<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title></title>
    <style>
        /* Черный фон, чтобы не было белой вспышки при загрузке */
        body { background-color: #000; color: #fff; margin: 0; overflow: hidden; }
    </style>
</head>
<body>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC1Qrdl-tuxjodpFgNDdpAtF_VSCv9Orlw",
            authDomain: "trty1-39fcb.firebaseapp.com",
            databaseURL: "https://trty1-39fcb-default-rtdb.firebaseio.com",
            projectId: "trty1-39fcb",
            storageBucket: "trty1-39fcb.firebasestorage.app",
            messagingSenderId: "438515366192",
            appId: "1:438515366192:web:f77d084c734df6935d70f5"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Мгновенный запрос к базе
        db.ref('tprank_redirects/tag1').once('value').then(snap => {
            if (snap.exists() && snap.val().url) {
                window.location.replace(snap.val().url);
            } else {
                document.body.innerHTML = '<h1 style="text-align:center; margin-top: 50px; font-family: sans-serif;">Метка не настроена</h1>';
            }
        }).catch(e => {
            document.body.innerHTML = '<h1 style="text-align:center; margin-top: 50px; font-family: sans-serif; color: red;">Ошибка</h1>';
        });
    </script>
</body>
</html>
