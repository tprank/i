<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Wi-Fi | Подключение</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f0f1a; --glass: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #00d4ff; --text: #ffffff; --text-dim: #a0a0b0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg); font-family: 'Inter', sans-serif; color: var(--text); min-height: 100vh;
            background-image: radial-gradient(circle at 10% 20%, rgba(0, 212, 255, 0.1) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(120, 86, 255, 0.1) 0%, transparent 40%);
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
            overflow: hidden; /* Чтобы копии не создавали скролл */
        }
        .container {
            width: 100%; max-width: 400px; background: var(--glass); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 24px; padding: 40px; text-align: center;
            transition: 0.5s; position: relative; z-index: 10;
        }
        .icon {
            font-size: 60px; margin-bottom: 20px; color: var(--accent);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
        }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        p { color: var(--text-dim); margin-bottom: 30px; }
        .btn {
            width: 100%; padding: 16px; background: linear-gradient(135deg, var(--accent), #7856ff);
            border: none; border-radius: 12px; color: white; font-size: 16px; font-weight: 600;
            cursor: pointer; transition: 0.3s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0, 212, 255, 0.3); }
        
        .loading-bar {
            width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px;
            margin-top: 20px; overflow: hidden; display: none;
        }
        .loading-fill {
            height: 100%; background: var(--accent); width: 0%; transition: width 2s ease;
        }
        
        /* СТИЛИ ДЛЯ ЛЕТАЮЩИХ КАРТИНОК */
        .meme-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 1000; display: none; overflow: hidden;
            background: rgba(0,0,0,0.3); /* Легкое затемнение фона */
        }
        .flying-meme {
            position: absolute;
            width: 150px; /* Размер каждой копии */
            height: auto;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            animation: fly linear infinite;
        }
        @keyframes fly {
            from { transform: translate(0, 0) rotate(0deg); }
            to { transform: translate(100vw, 100vh) rotate(360deg); }
        }
        
        /* Кнопка закрытия */
        .close-overlay-btn {
            position: fixed; top: 20px; right: 20px; z-index: 1100;
            background: rgba(255, 71, 87, 0.8); border: none; border-radius: 50%;
            width: 50px; height: 50px; color: white; font-size: 24px; cursor: pointer;
            display: none; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <div id="connectScreen">
            <div class="icon">📶</div>
            <h1>Free Wi-Fi</h1>
            <p>Бесплатный интернет для всех!</p>
            <button class="btn" onclick="startConnect()">Подключиться</button>
            <div class="loading-bar" id="loadingBar">
                <div class="loading-fill" id="loadingFill"></div>
            </div>
        </div>
    </div>

    <!-- Оверлей для летающих картинок -->
    <div class="meme-overlay" id="memeOverlay">
        <!-- Копии будут добавляться через JS -->
    </div>
    <button class="close-overlay-btn" id="closeOverlayBtn" onclick="closePrank()">×</button>

    <audio id="prankSound" src="https://tprank.github.io/cdn/vizg-svini 2.mp3" preload="auto"></audio>

    <script>
        function startConnect() {
            const btn = document.querySelector('.btn');
            const loadingBar = document.getElementById('loadingBar');
            const loadingFill = document.getElementById('loadingFill');
            
            btn.style.display = 'none';
            loadingBar.style.display = 'block';
            
            // Имитация загрузки
            setTimeout(() => {
                loadingFill.style.width = '100%';
            }, 100);
            
            // Через 2.5 секунды начинаем пранк
            setTimeout(() => {
                // Скрываем экран подключения
                document.getElementById('mainContainer').style.display = 'none';
                
                // Показываем оверлей и кнопку закрытия
                document.getElementById('memeOverlay').style.display = 'block';
                document.getElementById('closeOverlayBtn').style.display = 'flex';
                
                // Запускаем звук на полную громкость
                const sound = document.getElementById('prankSound');
                sound.volume = 1.0;
                sound.play().catch(e => console.log('Звук заблокирован:', e));
                
                // Создаем много копий картинки
                createFlyingMemes();
            }, 2500);
        }

        function createFlyingMemes() {
            const overlay = document.getElementById('memeOverlay');
            const count = 30; // Количество копий
            const imageUrl = "https://tprank.github.io/cdn/monkeymeme.jpeg";

            for (let i = 0; i < count; i++) {
                const img = document.createElement('img');
                img.src = imageUrl;
                img.className = 'flying-meme';
                
                // Случайная начальная позиция
                const startX = Math.random() * 100; // в процентах
                const startY = Math.random() * 100;
                img.style.left = startX + 'vw';
                img.style.top = startY + 'vh';
                
                // Случайная задержка анимации, чтобы они летели хаотично
                img.style.animationDelay = (Math.random() * 2) + 's';
                // Случайная длительность полета
                img.style.animationDuration = (2 + Math.random() * 3) + 's';
                
                overlay.appendChild(img);
            }
        }

        function closePrank() {
            // Останавливаем звук
            const sound = document.getElementById('prankSound');
            sound.pause();
            sound.currentTime = 0;
            
            // Убираем все картинки
            const overlay = document.getElementById('memeOverlay');
            overlay.innerHTML = '';
            overlay.style.display = 'none';
            document.getElementById('closeOverlayBtn').style.display = 'none';
            
            // Возвращаем экран подключения
            document.getElementById('mainContainer').style.display = 'block';
            
            // Сбрасываем кнопку и прогресс-бар
            const btn = document.querySelector('.btn');
            const loadingBar = document.getElementById('loadingBar');
            const loadingFill = document.getElementById('loadingFill');
            
            btn.style.display = 'block';
            loadingBar.style.display = 'none';
            loadingFill.style.width = '0%';
        }
    </script>
</body>
</html>
